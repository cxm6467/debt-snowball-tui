[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-snowball-tui"
version = "1.0.0"
description = "A terminal UI for calculating debt snowball payments and schedules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
]

[project.scripts]
debt-snowball = "debt_snowball.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
